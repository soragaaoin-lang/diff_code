<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLISM · 追加機能 PoC</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>◈ PLISM</strong><span>追加機能 PoC · Python / JavaScript</span><span id="version"></span></header>
<div id="status" role="status">比較を読み込み中…</div>
<main><aside class="changed-files"><h2>変更ファイル</h2><input id="filter" type="search" placeholder="ファイル名を検索" aria-label="変更ファイル検索"><div id="functions" hidden></div><div id="files"></div></aside><section class="workspace">
<div class="toolbar"><label class="file-picker">ファイル <select id="filePicker" aria-label="表示ファイル"></select></label><strong id="filename" hidden></strong><label>表示する版 <select id="side"><option value="head">変更後</option><option value="base">変更前</option></select></label><button id="back" disabled>元の差分へ戻る</button></div>
<section id="read"><div class="toolbar"><button id="showDiff">差分を表示</button><button id="showBody">全文を表示</button><button id="openSearch">複数行検索</button></div>
<section id="searchPanel" hidden><label for="query">ファイル本文の検索（改行を保持・完全一致）</label><textarea id="query" rows="3"></textarea><button id="find">検索</button><button id="next">次の一致</button><span id="matches"></span></section>
<div id="codeFrame"><div id="code" tabindex="0" aria-label="コード本文"></div><div id="changeRail" aria-label="全文内の変更位置" hidden></div></div><p id="railHint" class="hint" hidden>右端の目印：緑＝追加、赤＝削除。クリックで移動（選択中の版にない行は境界位置）。</p></section>
</section><aside class="detail" aria-label="グラフと解説"><nav><button data-tab="explain" class="active">解説・使用箇所</button><button data-tab="graph">関係グラフ</button><button data-tab="clones">重複・切り出し候補</button><button data-tab="limits">解析範囲</button></nav><section id="explain"><h2>選択した関数</h2><select id="symbol" aria-label="関数を選択"></select><div id="details"></div></section><section id="graph" hidden><div class="toolbar"><label>表示範囲 <select id="scope"><option value="all">コードベース全体</option><option value="file">選択ファイルと隣接</option></select></label><label>影響候補 <select id="depth"><option value="1">1 hop</option><option value="2" selected>2 hop</option></select></label><label>円の大きさ <select id="metric"><option value="incoming">呼び出し元の関数数</option><option value="outgoing">呼び出し先の関数数</option><option value="lines">行数</option></select></label><button id="fit">全体に合わせる</button></div><p id="graphLegend"></p><div id="cy"></div><p class="hint">関数を表示。緑は追加・変更、白い円は呼び出し元方向の影響候補、太線はその経路。静的に解決できた範囲です。</p></section>
<section id="clones" hidden><label><input id="existing" type="checkbox">既存の重複も表示</label><p class="hint">型1：構文一致。型2（限定版）：ローカル名の一貫した変更。先頭100グループまで。意味的な同一機能や安全な切り出しを保証しません。</p><div id="cloneList"></div></section>
<section id="limits" hidden><h2>機能ごとの解析範囲</h2><div id="coverage"></div></section>
</aside></main>
<script src="/cytoscape.min.js"></script><script src="/app.js"></script></body></html>
